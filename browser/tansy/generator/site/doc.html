<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Document | {{site.room_title}}</title>
<link rel="stylesheet" href="assets/vdr.css">
</head>
<body data-terms-key="{{site.terms_key}}">
<a class="skip" href="#main">Skip to content</a>
<div class="banner" role="note">{{site.banner}}</div>
<header class="topbar">
  <p class="brand">{{site.codename}} <span>Virtual data room</span></p>
  <nav class="mainnav" aria-label="Data room">
    <ul>
      <li><a href="room.html">Documents</a></li>
      <li><a href="qa.html">Q&amp;A</a></li>
      <li><button type="button" class="btn link" data-exit>Leave data room</button></li>
    </ul>
  </nav>
</header>
<main id="main" class="viewer">
  <nav class="crumbs" aria-label="Breadcrumb">
    <ol>
      <li><a href="room.html">Documents</a></li>
      <li id="crumb-folder"></li>
      <li id="crumb-doc" aria-current="page"></li>
    </ol>
  </nav>
  <p id="status" class="status" role="status">Loading the document...</p>
  <article id="doc" class="doc" hidden aria-labelledby="d-title">
    <header class="viewer-head">
      <p class="doc-ref">Document <span id="d-index"></span> <span class="sep" aria-hidden="true">|</span> <span id="d-version"></span></p>
      <h1 id="d-title"></h1>
      <dl class="meta" id="d-meta"></dl>
      <div id="d-notices"></div>
      <div id="d-actions" class="actions"></div>
    </header>
    <div id="d-body" class="doc-body"></div>
    <section id="d-history" class="history" aria-labelledby="history-h" hidden>
      <h2 id="history-h">Version history</h2>
      <ul id="d-history-list"></ul>
    </section>
  </article>
</main>
<script src="assets/common.js"></script>
<script src="assets/doc.js"></script>
</body>
</html>
